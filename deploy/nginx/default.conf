# Proxy de la central: sirve el frontend (SPA) y reenvía la API a app:8000.
# Caddy queda delante con TLS; nginx solo habla HTTP dentro de la red Docker.

upstream agentiot_api {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Ojo: un add_header dentro de un location anula estos; por eso se repiten.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API: auth, brokers, sensores (inscripción y heartbeat), alertas, reportes.
    location /api/ {
        proxy_pass http://agentiot_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Los reportes en lenguaje natural esperan a Ollama (OLLAMA_TIMEOUT=300).
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://agentiot_api;
        access_log off;
    }

    # Assets con hash de Vite: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html (sin caché).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
