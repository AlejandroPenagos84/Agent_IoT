x-app: &app
  build: .
  image: proyecto:latest
  entrypoint: ["python"]

services:
  certgen:
    image: alpine:3.20
    container_name: certgen
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache openssl >/dev/null
        mkdir -p /mosquitto/log
        chmod 777 /mosquitto/log
        if [ ! -f /certs/server.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /certs/server.key -out /certs/server.crt -days 3650 \
            -subj "/CN=mosquitto" \
            -addext "subjectAltName=DNS:mosquitto,DNS:localhost,IP:127.0.0.1"
          cp /certs/server.crt /certs/ca.crt
        fi
        chmod 644 /certs/server.key /certs/server.crt /certs/ca.crt
        echo "certificados listos"
    volumes:
      - ./mosquitto/certs:/certs:z
      - mosquitto-log:/mosquitto/log
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./mosquitto/certs:/mosquitto/certs:ro,z
      - mosquitto-log:/mosquitto/log
    command:
      - /bin/sh
      - -c
      - |
        i=0
        until [ -s /mosquitto/certs/server.crt ] && [ -s /mosquitto/certs/server.key ]; do
          i=$$((i + 1))
          if [ "$$i" -gt 60 ]; then
            echo "certificados no disponibles tras 60s" >&2
            exit 1
          fi
          sleep 1
        done
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -i healthcheck -u healthcheck -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull "$$OLLAMA_MODEL"
        echo "Modelo Ollama disponible: $$OLLAMA_MODEL"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  capture:
    build:
      context: .
      dockerfile: Dockerfile.capture
    image: proyecto-capture:latest
    container_name: capture
    network_mode: "service:mosquitto"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command:
      - --iface
      - eth0
      - --filter
      - ""
      - --exclude-topic
      - alertas/deteccion
      - --out
      - /capture/features.jsonl
    volumes:
      - capture-data:/capture
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped

  agente:
    <<: *app
    container_name: agente
    command:
      - -c
      - |
        from composition_root import AgentConfig, build_agent
        build_agent(AgentConfig(
            capture_path='/capture/features.jsonl',
            model_dir='/app/modelos_agente',
            broker_host='mosquitto',
            username='agente',
            alert_topic='alertas/deteccion',
            alert_dir='/alerts',
            model='${MODELO:-lstm}',
        )).run()
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - capture-data:/capture:ro
      - alert-data:/alerts
      - processed-data:/processed:ro
      - ./modelos_agente:/app/modelos_agente:ro,z
    restart: unless-stopped

  etl:
    <<: *app
    container_name: etl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        interval="$${ETL_INTERVAL_SECONDS:-300}"
        while :; do
          if find /alerts -maxdepth 1 -type f -name '*.jsonl' -size +0c | grep -q .; then
            python -m infrastructure.alert_processing \
              --input /alerts \
              --output /alerts/normalized
            python -m infrastructure.alert_processing.summaries \
              --input /alerts/normalized/alerts.parquet \
              --output /processed/summaries
          else
            echo "ETL: aún no hay alertas JSONL para procesar"
          fi
          sleep "$$interval"
        done
    environment:
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-300}
    volumes:
      - alert-data:/alerts
      - processed-data:/processed
    depends_on:
      agente:
        condition: service_started
    restart: unless-stopped

  simulador:
    <<: *app
    container_name: simulador
    command:
      - -m
      - simulation
      - --broker
      - mosquitto
      - --port
      - "1883"
      - --ataque
      - ${ATAQUE:-dos}
      - --paquetes
      - "500"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: "no"

  summaries:
    <<: *app
    container_name: summaries
    command:
      - -m
      - infrastructure.alert_processing.summaries
      - --input
      - /alerts/normalized/alerts.parquet
      - --output
      - /processed/summaries
    volumes:
      - alert-data:/alerts:ro
      - processed-data:/processed
    profiles:
      - etl

  normalize:
    <<: *app
    container_name: normalize
    command:
      - -m
      - infrastructure.alert_processing
      - --input
      - /alerts
      - --output
      - /alerts/normalized
    volumes:
      - alert-data:/alerts
    profiles:
      - etl

  report:
    <<: *app
    container_name: report
    command:
      - -m
      - infrastructure.alert_processing.report
      - --input
      - /processed/summaries
      - --output
      - /processed/report.json
    volumes:
      - processed-data:/processed
    profiles:
      - etl

  natural-report:
    <<: *app
    container_name: natural-report
    command:
      - -m
      - infrastructure.alert_processing.natural_report
      - --input
      - /processed/report.json
      - --ollama-timeout
      - ${OLLAMA_TIMEOUT:-300}
    volumes:
      - processed-data:/processed
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    profiles:
      - etl

  report-api:
    <<: *app
    container_name: report-api
    command:
      - -m
      - uvicorn
      - infrastructure.alert_processing.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${REPORT_API_PORT:-8000}:8000"
    volumes:
      - processed-data:/processed:ro
    environment:
      REPORT_SUMMARIES_DIR: /processed/summaries
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mosquitto-log:
  capture-data:
  alert-data:
  processed-data:
  ollama-data:
