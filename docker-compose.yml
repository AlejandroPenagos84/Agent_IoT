# Central de AgentIoT (lo que va en AWS): un solo proceso `app` con la API
# (auth + detección) y el agente que recibe las capturas por TLS 8443.
#
#   certgen  certificados autofirmados del agente (dev / sin dominio)
#   redis    códigos de verificación de correo
#   app      API + agente + retención; SQLite en el volumen app-data
#   web      nginx: frontend (React) + proxy de /api y /health hacia app:8000
#   caddy    HTTPS público hacia web:80
#
# Ollama (reportes en lenguaje natural) es opcional: --profile ollama.
# La captura del cliente y el laboratorio están en docker-compose.capture.yml.
name: agent_iot

services:
  certgen:
    image: alpine:3.20
    command: ["/bin/sh", "/certgen.sh"]
    environment:
      AGENT_CERT_DIR: /agent-certs
    volumes:
      - ./deploy/certgen.sh:/certgen.sh:ro,z
      - ${AGENT_CERT_HOST_DIR:-./certs/agent}:/agent-certs:z
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    restart: unless-stopped

  app:
    build: .
    image: agentiot-app:latest
    environment:
      # Rutas dentro del contenedor (fijas).
      AUTH_DB_PATH: /data/auth.db
      DETECTION_DB_PATH: /data/detection.db
      ALERTS_DIR: /alerts
      EVIDENCE_DIR: /evidence
      REPORT_PATH: /processed/report.json
      MODEL_DIR: /app/modelos_agente_tcp
      AUTH_REDIS_HOST: redis
      CAPTURE_ENDPOINT: tls://0.0.0.0:8443
      # Obligatorio.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?define AUTH_JWT_SECRET en .env}
      # Certificado del agente: el de certgen, o el de Caddy en producción.
      TLS_CERT: ${TLS_CERT:-/certs/agent/server.crt}
      TLS_KEY: ${TLS_KEY:-/certs/agent/server.key}
      # Lo que recibe la captura al inscribirse. Los valores por defecto
      # sirven para el laboratorio local (misma red Docker).
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://app:8000}
      AGENT_PUBLIC_ENDPOINT: ${AGENT_PUBLIC_ENDPOINT:-tls://app:8443}
      AGENT_TLS_SERVER_NAME: ${AGENT_TLS_SERVER_NAME:-app}
      AGENT_CA_PATH: ${AGENT_CA_PATH-/certs/agent/ca.crt}
      CAPTURE_IMAGE: ${CAPTURE_IMAGE:-agentiot-capture:latest}
    # Opcionales: se pasan solo si están en .env; si no, rige el valor por
    # defecto del código.
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
      - "${AGENT_BIND:-0.0.0.0}:${AGENT_PORT:-8443}:8443"
    volumes:
      - app-data:/data
      - alert-data:/alerts
      - evidence-data:/evidence
      - processed-data:/processed
      - ${AGENT_CERT_HOST_DIR:-./certs/agent}:/certs/agent:ro,z
      - caddy-data:/caddy:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      certgen:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    image: agentiot-web:latest
    ports:
      # Acceso directo sin TLS (pruebas locales), solo en 127.0.0.1.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      # Docker rootless no abre puertos < 1024: usa HTTP_PORT=8080 y
      # HTTPS_PORT=8444 o una redirección en el firewall.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
      AGENT_DOMAIN: ${AGENT_DOMAIN:-agent.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      CADDY_EXTRA_GLOBAL: ${CADDY_EXTRA_GLOBAL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    # Sin esperar a que app esté sana: en producción app espera el
    # certificado que emite Caddy.
    depends_on:
      - web
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  app-data:
  redis-data:
  alert-data:
  evidence-data:
  processed-data:
  caddy-data:
  caddy-config:
  ollama-data:
